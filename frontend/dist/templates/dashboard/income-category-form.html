<div class="container p-0 mt-9">
    <div class="mb-4 title">Создание категории доходов</div>

    <form id="income-category-form">
        <div class="position-relative mb-10" style="height: 38px;">
            <input type="text" class="form-control ps-8 py-12" id="name_category" name="name" placeholder="Название..." required>
            <label for="name_category" class="form-label"></label>
        </div>
        <div class="d-flex mt-13">
            <button class="btn btn-sm btn-success me-13 edit-btn px-3 py-10 btn-category" data-id="${cat.id}">Создать</button>
            <button class="btn btn-sm btn-danger delete-btn px-3 py-10 btn-category" data-id="${cat.id}">Отмена</button>
        </div>
    </form>
</div>
